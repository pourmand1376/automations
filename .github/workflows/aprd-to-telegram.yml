name: Publish aprd.ir posts to Telegram

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-aprd-ir-to-telegram
  cancel-in-progress: false

jobs:
  publish-aprd-ir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish aprd.ir posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBSITES_TELEGRAM_CHANNEL_ID: ${{ secrets.WEBSITES_TELEGRAM_CHANNEL_ID }}
        run: python -m workflows.runner aprd-ir
      - name: Commit updated APRD workflow state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/aprd_ir_to_telegram.json
          git diff --cached --quiet || git commit -m "chore: update APRD Telegram sync state"
          git push
