name: Publish Castbox episodes to Telegram

on:
  schedule:
    - cron: "57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-castbox-to-telegram
  cancel-in-progress: false

jobs:
  publish-castbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish Castbox episodes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CASTBOX_TELEGRAM_CHANNEL_ID: ${{ secrets.CASTBOX_TELEGRAM_CHANNEL_ID }}
        run: python -m workflows.runner castbox
      - name: Commit updated Castbox state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/castbox_to_telegram.json
          git diff --cached --quiet || git commit -m "chore: update Castbox Telegram sync state"
          git push
