name: Sync Raindrop Motamem URLs

on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raindrop-motamem-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Raindrop bookmarks
        env:
          RAINDROP_ACCESS_TOKEN: ${{ secrets.RAINDROP_ACCESS_TOKEN }}
        run: python -m workflows.raindrop_motamem_sync

      - name: Commit updated URL list
        run: |
          if git diff --quiet -- state/motamem_urls.json; then
            echo "No URL changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/motamem_urls.json
          git commit -m "chore: sync Motamem Raindrop URLs"
          git push
