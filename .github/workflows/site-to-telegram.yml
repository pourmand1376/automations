name: Publish amirpourmand.ir posts to Telegram

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-amirpourmand-ir-to-telegram
  cancel-in-progress: false

jobs:
  publish-amirpourmand-ir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish amirpourmand.ir posts
        env:
          AMIRPOURMAND_IR_TELEGRAM_BOT_TOKEN: ${{ secrets.AMIRPOURMAND_IR_TELEGRAM_BOT_TOKEN }}
          AMIRPOURMAND_IR_TELEGRAM_CHANNEL_ID: ${{ secrets.AMIRPOURMAND_IR_TELEGRAM_CHANNEL_ID }}
        run: python -m workflows.runner amirpourmand-ir
      - name: Commit updated workflow state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/amirpourmand_ir_to_telegram.json
          git diff --cached --quiet || git commit -m "chore: update Telegram sync state"
          git push
